name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch: # Manual trigger

env:
  AZURE_WEBAPP_NAME: occasio
  NODE_VERSION: '22.x'

permissions:
  contents: read

concurrency:
  group: azure-app-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Generate Prisma Client
      working-directory: ./backend
      env:
        DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL || 'postgresql://ci_user:ci_password@localhost:5432/occasio_ci' }}
      run: npx prisma generate

    - name: Run backend tests
      working-directory: ./backend
      run: npm test

    - name: Deploy Prisma migrations
      if: ${{ vars.AZURE_RUN_PRISMA_MIGRATIONS == 'true' }}
      working-directory: ./backend
      env:
        DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
      run: npm run prisma:migrate:deploy

    - name: Install production dependencies for deploy package
      working-directory: ./backend
      run: npm ci --omit=dev

    - name: Zip artifact for deployment
      run: |
        cd backend
        zip -r ../release.zip . \
          -x "test/*" \
          -x "uploads/*" \
          -x "tmp-local-*" \
          -x "*.dump" \
          -x "*.backup"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: release.zip
